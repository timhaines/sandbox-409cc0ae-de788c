name: release
on:
  push:
    branches: [update-64247]
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm version 0.1793764247.0 --no-git-tag-version
      - run: printf 'module.exports = "poc-6753f2e698892d55";\n' > index.js
      - run: npm publish
